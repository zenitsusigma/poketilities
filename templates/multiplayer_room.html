{% extends "base.html" %}
{% block title %}{{ site_name }} - Room {{ room_code }}{% endblock %}

{% block content %}
<h1>Room: <span class="room-code">{{ room_code }}</span></h1>
<p class="room-hint">Share this code with friends (if yo got em) so they can join.</p>

<div class="whos-that-game" id="game-area">
    <ul id="player-list" class="player-list"></ul>

    {% if is_host %}
    <button id="start-btn" type="button">Start Game</button>
    {% endif %}

    <div class="pokemon-stage">
        <img id="pokemon-sprite" src="" alt="Mystery Pokemon" class="silhouette" style="display: none;">
    </div>

    <div id="guess-display" class="guess-display"></div>

    <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">

    <p id="feedback"></p>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const ROOM_CODE = "{{ room_code }}";
    const PLAYER_NAME = "{{ player_name }}";
</script>
<script src="{{ url_for('static', filename='js/multiplayer-room.js') }}"></script>
{% endblock %}
